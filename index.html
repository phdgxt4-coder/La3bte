<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><title>BattleVerse</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1a;font-family:system-ui,sans-serif;color:#fff}
#c{width:100%;height:100%;display:block;outline:none}
.hidden{display:none!important}
#menu,#settings,#rotate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#1c2a4aee,#070a12f2)}
#rotate{z-index:99;background:#070a12;text-align:center}
h1{font-size:clamp(36px,9vh,72px);margin:0;letter-spacing:.12em;background:linear-gradient(90deg,#6cf,#c6f);-webkit-background-clip:text;color:transparent}
button{font:600 18px system-ui;color:#fff;background:#ffffff1f;border:1px solid #ffffff44;border-radius:14px;padding:12px 34px;min-width:200px;backdrop-filter:blur(8px)}
button.primary{background:linear-gradient(90deg,#2b8cff,#8a4dff);border:0}
label{display:flex;gap:12px;align-items:center;min-width:300px;justify-content:space-between}
#fps,#ver{position:fixed;top:calc(8px + env(safe-area-inset-top));font:12px monospace;background:#0008;padding:3px 8px;border-radius:6px}
#fps{left:calc(8px + env(safe-area-inset-left))}#ver{right:calc(8px + env(safe-area-inset-right));opacity:.7}
#loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#070a12;transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
#load-track{width:min(320px,60vw);height:4px;background:#ffffff22;border-radius:4px;overflow:hidden}
#load-bar{height:100%;width:0;background:linear-gradient(90deg,#2b8cff,#8a4dff);transition:width .2s}
#touch{position:fixed;inset:0;pointer-events:none}
#joy{position:absolute;left:6%;bottom:12%;width:130px;height:130px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff44}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:#ffffff66}
.tb{position:absolute;pointer-events:auto;min-width:0;width:76px;height:76px;border-radius:50%;padding:0;font-size:13px}
#btn-jump{right:7%;bottom:14%}#btn-sprint{right:19%;bottom:8%}
</style></head><body>
<canvas id="c"></canvas>
<div id="touch" class="hidden"><div id="joy"><div id="knob"></div></div><button class="tb" id="btn-sprint">SPRINT</button><button class="tb" id="btn-jump">JUMP</button></div>
<div id="fps">-- FPS</div><div id="ver"></div>
<div id="menu"><h1>BATTLEVERSE</h1><button class="primary" id="play">PLAY</button><button id="open-settings">SETTINGS</button><small id="backend"></small></div>
<div id="settings" class="hidden"><h1 style="font-size:32px">SETTINGS</h1>
<label>Camera sensitivity <input id="sens" type="range" min="0.3" max="2.5" step="0.05" value="1"></label>
<label>Camera distance <input id="dist" type="range" min="0.6" max="1.6" step="0.05" value="1"></label>
<label>Render scale <input id="scale" type="range" min="0.5" max="1" step="0.05" value="1"></label>
<button id="close-settings">BACK</button></div>
<div id="loading"><h1>BATTLEVERSE</h1><div id="load-track"><div id="load-bar"></div></div><small id="load-text">Starting…</small></div>
<div id="rotate"><h1 style="font-size:28px">ROTATE YOUR DEVICE</h1><p>BattleVerse runs in landscape.</p></div>
<script type="module" src="/main.ts"></script></body></html>
